name: Update index.html

on:
  push:
    paths:
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert finished lessons from "Coming soon" to live cards
        run: python update_index.py

      - name: Commit index.html if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f index.html.bak
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-update index.html: publish finished lessons"
          git push
